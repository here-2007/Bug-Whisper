<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Bug Whisper Prismatic Fracture & Heal Chevron -->
  <defs>
    <!-- Background Slate Gradient -->
    <linearGradient id="bgTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181b15" />
      <stop offset="100%" stop-color="#0f110d" />
    </linearGradient>

    <!-- Fault Upper Arm Gradients (Terracotta Chiseled Facets) -->
    <linearGradient id="faultTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7d4d" />
      <stop offset="60%" stop-color="#e25f34" />
      <stop offset="100%" stop-color="#cf4c20" />
    </linearGradient>
    <linearGradient id="faultBevel" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#c9491f" />
      <stop offset="100%" stop-color="#8a2a0a" />
    </linearGradient>

    <!-- Heal Lower Arm Gradients (Emerald Chiseled Facets) -->
    <linearGradient id="healBottom" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8efab1" />
      <stop offset="50%" stop-color="#7bd88f" />
      <stop offset="100%" stop-color="#55c26c" />
    </linearGradient>
    <linearGradient id="healBevel" x1="0%" y1="100%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#52bd69" />
      <stop offset="100%" stop-color="#247839" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7bd88f" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7bd88f" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Precision Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgTile)" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="#313628" stroke-width="1" fill="none" />

  <!-- Subtle Core Glow Behind Fault Point -->
  <circle cx="44" cy="32" r="18" fill="url(#coreGlow)" />

  <!-- ================= UPPER ARM: THE FAULT ================= -->
  <!-- Top Highlight Facet -->
  <polygon points="14,14 47,29 42,31.2 14,21.5" fill="url(#faultTop)" />
  <!-- Chiseled Shadow Bevel -->
  <polygon points="14,21.5 42,31.2 36,32.2 14,26.5" fill="url(#faultBevel)" />
  <!-- Micro Top Highlight Edge -->
  <line x1="14" y1="14" x2="47" y2="29" stroke="#ffa37d" stroke-width="0.8" stroke-linecap="round" />

  <!-- ================= LOWER ARM: THE REPAIR ================= -->
  <!-- Bottom Highlight Facet -->
  <polygon points="14,50 47,35 42,32.8 14,42.5" fill="url(#healBottom)" />
  <!-- Chiseled Shadow Bevel -->
  <polygon points="14,42.5 42,32.8 36,31.8 14,37.5" fill="url(#healBevel)" />
  <!-- Micro Bottom Highlight Edge -->
  <line x1="14" y1="50" x2="47" y2="35" stroke="#b6ffd0" stroke-width="0.8" stroke-linecap="round" />

  <!-- ================= OPTICAL FOCAL LOCK ================= -->
  <!-- Stepped Alignment Key at the fracture line -->
  <polygon points="46,30.5 51,32 46,33.5 44,32" fill="#ffffff" />
  <circle cx="51.5" cy="32" r="2.2" fill="#7bd88f" />
  <circle cx="51.5" cy="32" r="1.2" fill="#ffffff" />

  <!-- Micro Drafting Hairline Crosshair at Origin -->
  <line x1="8" y1="32" x2="11" y2="32" stroke="#484f3e" stroke-width="1" stroke-linecap="round" />
</svg>

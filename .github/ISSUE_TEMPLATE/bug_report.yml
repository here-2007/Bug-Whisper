name: Bug Report
description: File a bug report for Bug Whisper
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting an issue with Bug Whisper.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Code or Steps
      description: Minimal Python code snippet or steps to reproduce the issue.
      render: python
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Output of `bugwhisper env` or Python/browser version.
      render: shell
    validations:
      required: false

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bugwhisper"
version = "0.1.1"
description = "Deterministic runtime execution & neural Python error debugging studio powered by Qwen 2.5 Coder 3B"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "Pernav Jain" },
    { name = "Harshit Sharma" }
]
keywords = [
    "debugging",
    "python-errors",
    "traceback",
    "code-repair",
    "qwen",
    "llm",
    "ast-analysis",
    "pyodide"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
kaggle = [
    "kagglehub>=0.2.0",
    "transformers>=4.40.0",
    "torch>=2.0.0",
]
hf = [
    "huggingface_hub>=0.23.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "torch>=2.0.0",
]
all = [
    "kagglehub>=0.2.0",
    "huggingface_hub>=0.23.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "torch>=2.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "kagglehub>=0.2.0",
    "huggingface_hub>=0.23.0",
]

[project.scripts]
bugwhisper = "bugwhisper.cli.main:app"

[project.urls]
Homepage = "https://github.com/harshitthek/bug-whisper"
Documentation = "https://github.com/harshitthek/bug-whisper/blob/master/README.md"
Repository = "https://github.com/harshitthek/bug-whisper.git"
Issues = "https://github.com/harshitthek/bug-whisper/issues"
Model = "https://www.kaggle.com/models/pernavjain/bug-whisper-qwen25-coder-3b/"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["bugwhisper*"]

[tool.setuptools.package-data]
bugwhisper = ["py.typed"]
